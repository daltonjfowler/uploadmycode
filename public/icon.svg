  <!-- upload arrow (hat) -->
  <polygon points="32,5 23,15 41,15" fill="#FFFFFF"/>
  <rect x="29" y="14" width="6" height="7" fill="#FFFFFF"/>
  <!-- pins -->
  <rect x="8" y="27" width="6" height="3" rx="1" fill="#FFFFFF"/>
  <rect x="8" y="34" width="6" height="3" rx="1" fill="#FFFFFF"/>
  <rect x="8" y="41" width="6" height="3" rx="1" fill="#FFFFFF"/>
  <rect x="50" y="27" width="6" height="3" rx="1" fill="#FFFFFF"/>
  <rect x="50" y="34" width="6" height="3" rx="1" fill="#FFFFFF"/>
  <rect x="50" y="41" width="6" height="3" rx="1" fill="#FFFFFF"/>
  <!-- chip body -->
  <rect x="14" y="20" width="36" height="31" rx="6" fill="#FFFFFF"/>
  <!-- face -->
  <circle cx="25" cy="33" r="3" fill="#0F3D40"/>
  <circle cx="39" cy="33" r="3" fill="#0F3D40"/>
