<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="color-scheme" content="light dark" />
		<title>uploadmycode</title>
	</head>
	<body>
		<div class="app">
			<header class="toolbar">
				<span class="brand">uploadmycode</span>

				<label class="field">
					<span>Sketch</span>
					<select id="sketch-select" aria-label="Open sketch"></select>
				</label>

				<button id="new-sketch" type="button">New</button>
				<button id="rename-sketch" type="button">Rename</button>
				<button id="delete-sketch" type="button">Delete</button>

				<label class="field">
					<span>Examples</span>
					<select id="examples-select" aria-label="Open an example sketch">
						<option value="">Choose…</option>
					</select>
				</label>

				<button id="download-sketch" type="button">Download</button>
				<button id="upload-sketch" type="button">Upload</button>
				<input
					id="upload-input"
					type="file"
					accept=".ino,.pde,.txt,text/plain"
					hidden
					aria-hidden="true"
					tabindex="-1"
				/>

				<label class="check">
					<input id="autocomplete-toggle" type="checkbox" checked />
					Autocomplete
				</label>

				<span class="grow"></span>

				<button id="compile" class="primary" type="button">Compile</button>
				<span id="status" class="status" data-state="idle" role="status" aria-live="polite"
					>Ready</span
				>
			</header>

			<main id="editor" class="editor"></main>

			<section class="output" aria-label="Compiler output">
				<div class="output-head">
					<h2>Output</h2>
					<button id="clear-output" type="button" class="link">Clear</button>
				</div>
				<div id="error-list" class="error-list"></div>
				<pre id="output-text" class="output-text">Click Compile to check your sketch.</pre>
			</section>

			<footer class="footer">
				<span>Arduino Uno only. Internal district tool.</span>
				<a href="https://daltonjfowler.com" target="_blank" rel="noopener"
					>Made by Dalton Fowler</a
				>
			</footer>
		</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
