<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="color-scheme" content="light dark" />
		<title>uploadmycode</title>
	</head>
	<body>
		<div class="app">
			<header class="toolbar">
				<span class="brand">uploadmycode</span>

				<label class="field">
					<span>Sketch</span>
					<select id="sketch-select" aria-label="Open sketch"></select>
				</label>

				<button id="new-sketch" type="button">New</button>
				<button id="rename-sketch" type="button">Rename</button>
				<button id="delete-sketch" type="button">Delete</button>

				<button id="download-sketch" type="button">Download</button>
				<button id="import-sketch" type="button">Import</button>
				<input
					id="import-input"
					type="file"
					accept=".ino,.pde,.txt,text/plain"
					hidden
					aria-hidden="true"
					tabindex="-1"
				/>

				<label class="check">
					<input id="autocomplete-toggle" type="checkbox" checked />
					Autocomplete
				</label>

				<span class="grow"></span>

				<button id="compile" class="primary" type="button">Compile</button>
				<button id="upload" class="primary" type="button" disabled title="Compile first.">
					Upload
				</button>
				<span id="status" class="status" data-state="idle" role="status" aria-live="polite"
					>Ready</span
				>
			</header>

			<main id="editor" class="editor"></main>

			<section class="output" aria-label="Compiler output">
				<div class="output-head">
					<h2>Output</h2>
					<a id="serial-help" class="serial-help" href="/serial-test.html" target="_blank" rel="noopener" hidden
						>Web Serial test page</a
					>
					<span class="grow"></span>
					<button id="clear-output" type="button" class="link">Clear</button>
				</div>
				<div id="upload-progress" class="progress" hidden>
					<progress id="upload-bar" max="1" value="0"></progress>
					<span id="upload-count" class="progress-count"></span>
				</div>
				<div id="error-list" class="error-list"></div>
				<pre id="output-text" class="output-text">Click Compile to check your sketch.</pre>
			</section>

			<section class="monitor" aria-label="Serial monitor">
				<div class="output-head">
					<h2>Serial Monitor</h2>
					<span id="monitor-state" class="monitor-state" data-state="disconnected" role="status"
						>Not connected</span
					>
					<span class="grow"></span>
					<button id="monitor-show" type="button" class="link" aria-expanded="false">Show</button>
				</div>

				<div id="monitor-body" class="monitor-body" hidden>
					<div class="monitor-controls">
						<button id="monitor-connect" type="button">Connect</button>

						<label class="field">
							<span>Baud</span>
							<select id="monitor-baud" aria-label="Baud rate"></select>
						</label>

						<label class="check">
							<input id="monitor-autoscroll" type="checkbox" checked />
							Autoscroll
						</label>

						<label class="check">
							<input id="monitor-timestamps" type="checkbox" />
							Timestamps
						</label>

						<span class="grow"></span>
						<button id="monitor-clear" type="button" class="link">Clear</button>
					</div>

					<pre id="monitor-output" class="monitor-output" tabindex="0"></pre>

					<form id="monitor-send" class="monitor-send">
						<input
							id="monitor-input"
							type="text"
							placeholder="Type a message, press Enter to send"
							autocomplete="off"
							aria-label="Message to send to the board"
							disabled
						/>
						<label class="field">
							<span>Ending</span>
							<select id="monitor-ending" aria-label="Line ending"></select>
						</label>
						<button id="monitor-send-button" type="submit" disabled>Send</button>
					</form>
				</div>
			</section>

			<footer class="footer">
				<span>Arduino Uno only. Internal district tool.</span>
				<a href="https://daltonjfowler.com" target="_blank" rel="noopener"
					>Made by Dalton Fowler</a
				>
			</footer>
		</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
